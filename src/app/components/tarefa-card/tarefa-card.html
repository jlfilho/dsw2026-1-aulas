<mat-card class="tarefa-card">
  <mat-card-header>
    <mat-card-title>{{ nome() | titlecase}}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>
      <strong>Status:</strong>
      {{ status() | statusTarefaLabel }}
    </p>

    <p>
      <strong>Prioridade:</strong>
      {{ prioridade() | prioridadeLabel }}
    </p>
    <p>
      <strong>Estudante:</strong>
      {{ estudanteNome() | titlecase}}
    </p>
    <p>
      <strong>Data de Entrega:</strong>
      {{ dataEntrega() | date:'dd/MM/yyyy' }}
    </p>

    <details class="debug-card">
      <summary>Ver dados técnicos da tarefa</summary>

      <pre>{{ dadosDebug() | json }}</pre>
    </details>

  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" type="button" (click)="aoClicarEditar()">Editar</button>

    <button mat-button color="warn" type="button" (click)="aoClicarRemover()">Remover</button>
  </mat-card-actions>
</mat-card>
